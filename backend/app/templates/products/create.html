{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Add Product</h1>
    <a href="/products" class="btn-ghost">← Back</a>
</div>

<form id="productForm" style="background:#fff;padding:24px;border-radius:8px;max-width:600px">

    <div class="form-row">
        <div class="form-group" style="flex:2">
            <label>Product Name *</label>
            <input type="text" name="name" placeholder="e.g. Gold Necklace 22K" required>
        </div>
        <div class="form-group">
            <label>Metal Type</label>
            <select name="metal_type">
                <option value="gold">Gold</option>
                <option value="silver">Silver</option>
                <option value="other">Other</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Purity</label>
            <input type="text" name="purity" placeholder="e.g. 22K, 18K, 925">
        </div>
        <div class="form-group">
            <label>HSN Code</label>
            <input type="text" name="hsn_code" value="7113">
        </div>
        <div class="form-group">
            <label>GST Rate (%)</label>
            <select name="gst_rate">
                <option value="3.0" selected>3%</option>
                <option value="1.5">1.5%</option>
                <option value="0">0%</option>
                <option value="18.0">18%</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Making Charge Rate (₹/g)</label>
            <input type="number" name="making_charge_rate" step="0.01" min="0"
                   placeholder="Optional default making charge">
        </div>
        <div class="form-group">
            <label>HUID</label>
            <input type="text" name="huid" placeholder="Hallmark ID if fixed">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:2">
            <label>Group / Category</label>
            <div style="display:flex;gap:8px">
                <select name="group_id" id="groupSelect" style="flex:1">
                    <option value="">-- No Group --</option>
                    {% for g in groups %}
                    <option value="{{ g.id }}">{{ g.name }}</option>
                    {% endfor %}
                </select>
                <button type="button" onclick="addGroup()" class="btn-secondary btn-sm">+ New</button>
            </div>
        </div>
    </div>

    <div class="form-group" style="margin-bottom:20px">
        <label>Description</label>
        <textarea name="description" rows="2" placeholder="Optional notes about this product"></textarea>
    </div>

    <div class="form-actions">
        <button type="button" onclick="saveProduct()" class="btn-primary btn-large">Save Product</button>
        <a href="/products" class="btn-ghost">Cancel</a>
    </div>
</form>

{% endblock %}

{% block scripts %}
<script>
async function addGroup() {
    const name = prompt("New group name:");
    if (!name) return;
    const res  = await fetch("/products/groups/create", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name}),
    });
    const data = await res.json();
    if (data.success) {
        const sel = document.getElementById("groupSelect");
        const opt = document.createElement("option");
        opt.value = data.group_id;
        opt.text  = data.name;
        opt.selected = true;
        sel.appendChild(opt);
    }
}

async function saveProduct() {
    const form = document.getElementById("productForm");
    const name = form.querySelector('[name="name"]').value.trim();
    if (!name) { alert("Product name is required."); return; }

    const payload = {
        name,
        metal_type:         form.querySelector('[name="metal_type"]').value,
        purity:             form.querySelector('[name="purity"]').value             || null,
        hsn_code:           form.querySelector('[name="hsn_code"]').value           || "7113",
        gst_rate:           form.querySelector('[name="gst_rate"]').value,
        making_charge_rate: form.querySelector('[name="making_charge_rate"]').value || null,
        huid:               form.querySelector('[name="huid"]').value               || null,
        group_id:           form.querySelector('[name="group_id"]').value           || null,
        description:        form.querySelector('[name="description"]').value        || null,
    };

    const res  = await fetch("/products/create", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = "/products";
    } else {
        alert("Error: " + data.error);
    }
}
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Add Party{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Add New Party</h1>
    <a href="/parties" class="btn-ghost">← Back</a>
</div>

<form id="partyForm" style="background:#fff;padding:24px;border-radius:8px;max-width:700px">

    <div class="form-row">
        <div class="form-group">
            <label>Party Type *</label>
            <select name="type" id="partyType">
                <option value="customer" {{ 'selected' if prefill_type == 'customer' else '' }}>Customer</option>
                <option value="supplier" {{ 'selected' if prefill_type == 'supplier' else '' }}>Supplier</option>
                <option value="both" {{ 'selected' if prefill_type == 'both' else '' }}>Both</option>
            </select>
        </div>
        <div class="form-group" style="flex:2">
            <label>Full Name *</label>
            <input type="text" name="name" placeholder="e.g. Ramesh Kumar / Kumar Jewellers" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" placeholder="9876543210">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="optional">
        </div>
        <div class="form-group">
            <label>City</label>
            <input type="text" name="city" placeholder="e.g. Varanasi">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:2">
            <label>Address</label>
            <input type="text" name="address" placeholder="Street / area">
        </div>
        <div class="form-group">
            <label>State</label>
            <input type="text" name="state" value="Uttar Pradesh">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:2">
            <label>GSTIN</label>
            <input type="text" name="gstin" id="gstinInput" placeholder="09ABCDE1234F1Z5"
                   maxlength="15" style="text-transform:uppercase"
                   oninput="this.value=this.value.toUpperCase();validateGSTIN(this.value)">
            <small id="gstinMsg" style="font-size:11px;color:#888">15 characters — leave blank if no GST</small>
        </div>
    </div>

    <!-- Credit settings — mostly relevant for suppliers and b2b customers -->
    <div class="form-row">
        <div class="form-group">
            <label>Credit Limit (₹)</label>
            <input type="number" name="credit_limit" placeholder="0 = no limit" min="0" step="100">
        </div>
        <div class="form-group">
            <label>Credit Days</label>
            <input type="number" name="credit_days" placeholder="e.g. 30" min="0">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Opening Balance (₹)</label>
            <input type="number" name="opening_balance" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="form-group">
            <label>Balance Type</label>
            <select name="opening_balance_type">
                <option value="">— None —</option>
                <option value="debit">Debit (they owe you)</option>
                <option value="credit">Credit (you owe them)</option>
            </select>
        </div>
    </div>

    <div class="form-group" style="margin-bottom:20px">
        <label>Notes</label>
        <textarea name="notes" rows="2" placeholder="Any extra information..."></textarea>
    </div>

    <div class="form-actions">
        <button type="button" onclick="submitParty()" class="btn-primary btn-large">Save Party</button>
        <a href="/parties" class="btn-ghost">Cancel</a>
    </div>
</form>

{% endblock %}

{% block scripts %}
<script>
function validateGSTIN(val) {
    const msg = document.getElementById("gstinMsg");
    if (!val) { msg.textContent = "15 characters — leave blank if no GST"; msg.style.color = "#888"; return; }
    const re = /^\d{2}[A-Z]{5}\d{4}[A-Z]{1}[A-Z\d]{1}Z[A-Z\d]{1}$/;
    if (val.length === 15 && re.test(val)) {
        msg.textContent = "✓ Valid GSTIN format";
        msg.style.color = "#28a745";
    } else {
        msg.textContent = val.length < 15 ? `${val.length}/15 characters` : "✗ Invalid format";
        msg.style.color = val.length < 15 ? "#888" : "#dc3545";
    }
}

async function submitParty() {
    const form = document.getElementById("partyForm");
    const name = form.querySelector('[name="name"]').value.trim();
    if (!name) { alert("Party name is required."); return; }

    const payload = {
        type:                 form.querySelector('[name="type"]').value,
        name,
        phone:                form.querySelector('[name="phone"]').value.trim()    || null,
        email:                form.querySelector('[name="email"]').value.trim()    || null,
        address:              form.querySelector('[name="address"]').value.trim()  || null,
        city:                 form.querySelector('[name="city"]').value.trim()     || null,
        state:                form.querySelector('[name="state"]').value.trim()    || null,
        gstin:                form.querySelector('[name="gstin"]').value.trim()    || null,
        credit_limit:         form.querySelector('[name="credit_limit"]').value    || null,
        credit_days:          form.querySelector('[name="credit_days"]').value     || null,
        opening_balance:      form.querySelector('[name="opening_balance"]').value || null,
        opening_balance_type: form.querySelector('[name="opening_balance_type"]').value || null,
        notes:                form.querySelector('[name="notes"]').value           || null,
    };

    const res  = await fetch("/parties/create", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = "/parties/" + data.party_id;
    } else {
        alert("Error: " + data.error);
    }
}
</script>
{% endblock %}

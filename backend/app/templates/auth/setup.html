<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Time Setup — Jewellery Billing</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f5f5f5; }
        .auth-box { background:#fff; border-radius:12px; padding:40px; width:100%; max-width:400px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
        .auth-box h1 { font-size:22px; margin-bottom:4px; color:#1a237e; }
        .auth-box p.sub { color:#888; font-size:13px; margin-bottom:28px; }
        .error-msg { background:#fdecea; color:#c62828; padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:16px; display:none; }
    </style>
</head>
<body>
<div class="auth-box">
    <h1>🔐 Welcome</h1>
    <p class="sub">Create your owner account to get started. This only runs once.</p>

    <div class="error-msg" id="errMsg"></div>

    <div class="form-group" style="margin-bottom:14px">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g. owner" autocomplete="username">
    </div>
    <div class="form-group" style="margin-bottom:14px">
        <label>Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">
    </div>
    <div class="form-group" style="margin-bottom:24px">
        <label>Confirm Password</label>
        <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password">
    </div>

    <button onclick="doSetup()" class="btn-primary btn-large" style="width:100%">Create Account →</button>
</div>

<script>
async function doSetup() {
    const err = document.getElementById("errMsg");
    err.style.display = "none";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const confirm  = document.getElementById("confirm").value.trim();

    const res  = await fetch("/auth/setup", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password, confirm}),
    });
    const data = await res.json();

    if (data.success) {
        window.location.href = data.redirect;
    } else {
        err.textContent    = data.error;
        err.style.display  = "block";
    }
}

// Allow Enter key to submit
document.addEventListener("keydown", e => { if (e.key === "Enter") doSetup(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-time Setup — JewelBill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">

<div class="auth-page">

    <div class="auth-panel-left">
        <div class="auth-panel-brand">
            <div class="auth-brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
            </div>
            <span class="auth-brand-name">JewelBill</span>
        </div>
        <div class="auth-panel-content">
            <h2 class="auth-panel-headline">One-time setup.<br>Ready forever.</h2>
            <p class="auth-panel-sub">Create your owner account to activate your billing system.</p>
        </div>
        <div class="auth-panel-decoration">
            <div class="auth-deco-ring auth-deco-ring-1"></div>
            <div class="auth-deco-ring auth-deco-ring-2"></div>
            <div class="auth-deco-ring auth-deco-ring-3"></div>
        </div>
    </div>

    <div class="auth-panel-right">
        <div class="auth-form-wrap">

            <div class="auth-form-header">
                <div class="auth-setup-badge">Setup</div>
                <h1 class="auth-form-title">Create owner account</h1>
                <p class="auth-form-sub">This runs only once. You'll use these credentials to log in.</p>
            </div>

            <div class="auth-error" id="errMsg"></div>

            <div class="field-group">
                <label class="field-label" for="username">Username</label>
                <div class="field-input-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input class="field-input" type="text" id="username" placeholder="e.g. owner" autocomplete="username">
                </div>
            </div>

            <div class="field-group">
                <label class="field-label" for="password">Password</label>
                <div class="field-input-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input class="field-input" type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">
                    <button type="button" class="field-eye-btn" onclick="togglePwd('password')" tabindex="-1">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label" for="confirm">Confirm Password</label>
                <div class="field-input-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    <input class="field-input" type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password">
                </div>
            </div>

            <button onclick="doSetup()" class="btn btn-gold btn-full btn-lg" id="setupBtn">
                Create Account
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>

        </div>
    </div>

</div>

<script>
function togglePwd(id) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function doSetup() {
    const err = document.getElementById('errMsg');
    const btn = document.getElementById('setupBtn');
    err.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    if (!username || !password || !confirm) {
        err.textContent = 'All fields are required.';
        err.style.display = 'flex';
        return;
    }
    if (password !== confirm) {
        err.textContent = 'Passwords do not match.';
        err.style.display = 'flex';
        return;
    }
    if (password.length < 6) {
        err.textContent = 'Password must be at least 6 characters.';
        err.style.display = 'flex';
        return;
    }

    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = 'Creating account…';

    try {
        const res = await fetch('/auth/setup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, confirm }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
            window.location.href = data.redirect;
            return;
        }
        err.textContent = data.error || 'Unable to create account.';
        err.style.display = 'flex';
    } catch (_) {
        err.textContent = 'Network error. Please try again.';
        err.style.display = 'flex';
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Create Account <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doSetup(); });
</script>
</body>
</html>

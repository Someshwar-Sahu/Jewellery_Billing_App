<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Jewellery Billing</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f5f5f5; }
        .auth-box { background:#fff; border-radius:12px; padding:40px; width:100%; max-width:380px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
        .auth-box h1 { font-size:22px; margin-bottom:4px; color:#1a237e; }
        .auth-box p.sub { color:#888; font-size:13px; margin-bottom:28px; }
        .error-msg { background:#fdecea; color:#c62828; padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:16px; display:none; }
    </style>
</head>
<body>
<div class="auth-box">
    <h1>💎 Jewellery Billing</h1>
    <p class="sub">Sign in to continue</p>

    <div class="error-msg" id="errMsg"></div>

    <div class="form-group" style="margin-bottom:14px">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="form-group" style="margin-bottom:24px">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
    </div>

    <button onclick="doLogin()" class="btn-primary btn-large" style="width:100%">Sign In →</button>

    <p style="margin-top:20px;font-size:12px;color:#aaa;text-align:center">
        Forgot password? Ask your system administrator to reset it.
    </p>
</div>

<script>
const NEXT = "{{ next }}";

async function doLogin() {
    const err = document.getElementById("errMsg");
    err.style.display = "none";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
        err.textContent   = "Please enter username and password.";
        err.style.display = "block";
        return;
    }

    const res  = await fetch("/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password, next: NEXT}),
    });
    const data = await res.json();

    if (data.success) {
        window.location.href = data.redirect || "/invoices";
    } else {
        err.textContent   = data.error;
        err.style.display = "block";
    }
}

document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>

services:
  - type: web
    name: jewellery-billing
    runtime: python
    region: singapore   # closest to India
    plan: free

    # Render runs this from the repo root — adjust if your backend/ is nested
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    # Run Alembic migrations then start the server
    # Migrations run automatically on every deploy (safe — Alembic is idempotent)
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard — never commit

      - key: SECRET_KEY
        sync: false          # Set manually in Render dashboard

      - key: APP_NAME
        value: Jewellery Billing App

      - key: GOOGLE_API_KEY
        sync: false          # Optional — set only if using Scan Bill feature

      - key: PYTHON_VERSION
        value: 3.11.0

    healthCheckPath: /health